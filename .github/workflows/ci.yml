name: CI

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# A new push to the same PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The commit-msg hook checks each commit as it is made; this re-checks every
  # commit on the PR, so one made with --no-verify, or before the hook was
  # installed, still fails the branch. The synthetic merge commit a
  # pull_request checkout sits on starts "Merge " and is exempt.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-commit-message.mjs --range origin/${{ github.base_ref }}..HEAD

  # Every gate script that exists runs here or in the migrations job below, and
  # .claude/skills/local-review runs the same list before a push. Keep the two
  # in step.
  check:
    name: Typecheck, test & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Installs every workspace (apps/web, apps/mobile, packages/brand,
      # packages/contract) at once.
      - name: Install dependencies
        run: npm ci

      # The pre-commit hook scans staged blobs; this re-scans every tracked
      # file, so a secret committed with --no-verify (or before the hook was
      # installed) still fails the branch.
      - name: Check secrets
        run: npm run check:secrets

      # The template repository keeps no session logs or agent worktrees; a copy
      # of it (its own repository) commits its logs as usual and passes trivially.
      - name: Check the template is clean
        run: npm run check:template

      # apps/web, apps/mobile, packages/contract and packages/brand, each with its
      # own tsconfig.
      - name: Typecheck (web, mobile, contract, brand)
        run: npm run typecheck

      # One ESLint config for the whole repo (eslint.config.mjs). Errors and
      # warnings both fail the build: the lint script carries --max-warnings=0.
      - name: Lint (web + mobile)
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # The standards checklist (docs/STANDARDS.md): the scaffolding every
      # repo carries is still wired. A deliberate divergence is recorded, with
      # its reason, in scripts/standards-exceptions.json, and an entry whose
      # standard is now met fails the run.
      - name: Check standards
        run: npm run check:standards

      # An event fired but not registered is rejected by /api/track with a 400
      # and vanishes with no error anywhere a person would see. This is the gate
      # that turns that silent data loss into a red build. Each app's call sites
      # are checked against its own registry; registered-but-unfired only warns.
      - name: Check events
        run: npm run check:events

      # In every workspace standards.config.json lists, each process.env read is
      # declared in the app's Zod schema and its .env.example, and nothing
      # declared there goes unread.
      - name: Check env
        run: npm run check:env

      # The store-review rules a file can decide (docs/rules/store-review.md):
      # purpose strings, privacy manifest, Android permissions, ATT, account
      # deletion, paywall links, Sign in with Apple, mock data out of release.
      - name: Check store readiness
        run: npm run check:store

      # The script tests (scripts/*.test.mjs), mobile Jest (packages/brand's
      # suites run there too), and the apps/web and packages/contract suites.
      # The same `npm test` local-review runs.
      - name: Tests
        run: npm test

      # Build the web app. Supabase/analytics keys are not required to compile —
      # the lib clients throw at request time, not build time — so this validates
      # the marketing site and API routes type-check and bundle cleanly.
      - name: Build web
        run: npm run web:build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  # The schema gate (docs/rules/migrations.md). Replays every migration in
  # apps/web/prisma/schema/migrations onto an empty Postgres, then proves what the
  # rest of CI cannot see: the Prisma schema and the migrations agree (drift), the
  # run-once SQL applies, every table keeps RLS with nothing granted to the API
  # roles (check:rls), and the database suites pass as a non-superuser runtime
  # role. A schema change with no migration gets one generated and committed back
  # to the PR. Modelled on template-web's job.
  #
  # Throwaway credentials for a throwaway database: nothing here reaches production.
  migrations:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # DIRECT_URL is required even though the running app never reads it: the
      # schema declares directUrl = env("DIRECT_URL"), so every migrate command
      # validates it.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PGOPTIONS: '-c client_min_messages=warning'
    services:
      postgres:
        # New Supabase projects run Postgres 17.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # Exchanges org-level GitHub App credentials for a short-lived token, so the
      # generated-migration commit triggers its own CI run. Gated on `vars` because
      # `secrets` is not valid in `if:`. Without the App the job falls back to a
      # MIGRATIONS_TOKEN, then GITHUB_TOKEN, whose commits do not trigger CI.
      - uses: actions/create-github-app-token@v2
        id: app-token
        if: vars.MIGRATIONS_APP_ID != ''
        with:
          app-id: ${{ vars.MIGRATIONS_APP_ID }}
          private-key: ${{ secrets.MIGRATIONS_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token || secrets.MIGRATIONS_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci # apps/web's postinstall runs `prisma generate`
      # Supabase owns the auth and storage schemas, the API roles and a project's
      # default privileges. The baseline references them, so a plain Postgres needs
      # this stand-in first. Test scaffolding only; it never runs on Supabase.
      - name: Stand in for Supabase
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f apps/web/prisma/ci/supabase-shim.sql
      - name: Replay committed migrations
        run: npx prisma migrate deploy --schema apps/web/prisma/schema
      # HEAD_REF crosses into the shell as an environment variable, never as ${{ }}
      # inside the script: this job holds contents:write, and a refname may carry
      # `;`, `$` or backticks.
      - name: Generate missing migration (PRs only, not forks)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/generate-migration.mjs --name "$HEAD_REF" --db-url "$DATABASE_URL"
      - name: Commit generated migration if any
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -n "$(git status --porcelain apps/web/prisma/schema/migrations)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add apps/web/prisma/schema/migrations
            git commit -m "chore(db): add generated migration"
            git push
          else
            echo "No new migration to commit."
          fi
      # The ledger here is empty, so the file always applies: a broken one-off, or
      # one that needs rows only production has, fails on the PR instead of on main.
      - name: Apply run-once SQL
        run: node scripts/run-once-sql.mjs --db-url "$DATABASE_URL"
      - name: Check for drift
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel apps/web/prisma/schema --exit-code
      # RLS, policies and grants are invisible to the drift check. This reads the
      # catalog: RLS on every table, none forced, no policy and nothing granted to
      # anon or authenticated (APP_READ_TABLES, the one escape hatch, is empty), no
      # server-controlled column writable by an API role, no view or definer
      # function an API role can reach. See docs/rules/database.md.
      - name: Verify RLS and grants
        run: npm run check:rls
      # Every other suite connects as a superuser, which may do anything; these
      # connect as a non-superuser runtime role, as production does, so a missing
      # grant or a trigger that needs more than it has fails here, not in production.
      - name: Database suites, as the runtime role
        run: npm run test:db --workspace=@app/web
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
