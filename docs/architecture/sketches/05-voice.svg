<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Voice: Xiaohei pours what you said down a funnel to Whisper and back as text you can fix; above, the students' questions come back as Orpheus voices, with the device's own voice as the fallback">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');
    text { font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive; fill: #111; }
    .big { font-size: 40px; font-weight: 700; }
    .mid { font-size: 32px; font-weight: 600; }
    .note { font-size: 28px; }
    .orange { fill: #e8730c; } .red { fill: #d62828; } .blue { fill: #2563eb; }
  </style>
  <defs>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#e8730c" stroke-width="1.6" stroke-linecap="round"/></marker>
    <g id="xh">
      <path d="M-12 -4 L-14 0 M10 -4 L12 0 M-11 -22 L-12 -4 M9 -22 L10 -4" stroke="#111" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M-26 -40 C-30 -70 -18 -92 2 -90 C22 -88 30 -66 26 -40 C23 -24 10 -18 -2 -19 C-16 -20 -24 -27 -26 -40 Z" fill="#111" stroke="#111" stroke-width="2"/>
      <circle cx="-8" cy="-62" r="3.6" fill="#fff"/><circle cx="9" cy="-60" r="3.6" fill="#fff"/>
    </g>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>

  <g filter="url(#wobble)" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- a mouth of sound waves, left: what the person says -->
    <path d="M150 540 C170 520 170 600 150 580 M190 520 C220 500 220 620 190 600 M230 500 C270 480 270 640 230 620"/>
    <!-- the funnel Xiaohei pours into, centre -->
    <path d="M560 420 L760 422 L690 540 L690 620 L630 620 L630 540 Z"/>
    <!-- the Whisper box under it -->
    <path d="M590 660 L730 662 L729 740 L591 738 Z"/>
    <!-- a note with words coming out, with a pencil (fix a word) -->
    <path d="M1000 600 L1200 602 L1199 720 L1001 718 Z"/>
    <path d="M1020 636 L1180 637 M1020 662 L1170 663 M1020 688 L1120 689" stroke-width="1.8"/>
    <path d="M1150 560 L1210 640 M1160 552 L1220 632 M1150 560 L1160 552" stroke-width="2"/>
    <!-- the students' speaker, top: a horn -->
    <path d="M980 200 L1060 170 L1060 290 L980 260 Z"/>
    <path d="M940 210 L980 210 L980 250 L940 250 Z"/>
    <path d="M1090 200 C1110 220 1110 250 1090 270 M1120 180 C1150 210 1150 260 1120 290" stroke-width="2"/>
  </g>

  <!-- orange: what you say down to text; the question out to sound -->
  <g fill="none" stroke="#e8730c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" filter="url(#wobble)">
    <path d="M280 560 C360 520 420 420 500 400"/>
    <path d="M740 700 C820 700 900 670 990 660"/>
    <path d="M700 250 C780 220 860 220 930 228"/>
  </g>
  <!-- the question text going up, plain black -->
  <g filter="url(#wobble)" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round">
    <path d="M520 220 L660 222 L659 280 L521 278 Z"/>
    <path d="M540 244 L630 245 M540 262 L610 263" stroke-width="1.6"/>
  </g>

  <!-- Xiaohei, tipping a bucket of sound into the funnel -->
  <use href="#xh" transform="translate(470 520) scale(1.3)"/>
  <g filter="url(#wobble)" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M500 450 L540 430 M496 470 L548 452"/>
    <path d="M520 390 L580 380 L590 430 L540 445 Z"/>
    <path d="M580 400 C600 410 610 420 620 440" stroke="#e8730c" stroke-width="2.4"/>
  </g>

  <!-- labels -->
  <text x="120" y="660" class="mid">hold to answer</text>
  <text x="120" y="700" class="note blue">web: WAV as you talk · phone: m4a at stop</text>
  <text x="780" y="460" class="note blue">explain: cut at each pause</text>
  <text x="600" y="790" class="mid">Whisper</text>
  <text x="780" y="740" class="note">speech/transcriptions</text>
  <text x="1000" y="770" class="mid">what you said: fix, then send</text>
  <text x="500" y="200" class="note">the question, by id</text>
  <text x="940" y="150" class="mid">the student says it (Orpheus)</text>
  <text x="1160" y="250" class="note blue">fetched when the hand goes up</text>
  <text x="1160" y="330" class="note red">100 a day · then the device's voice</text>
  <text x="120" y="830" class="note red">audio is never stored</text>
</svg>
