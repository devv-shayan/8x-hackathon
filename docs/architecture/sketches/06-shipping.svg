<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Shipping: a branch rolls through local gates and CI to main, Vercel deploys it, and for phones Xiaohei throws the switch between an update and a store build">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');
    text { font-family: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive; fill: #111; }
    .big { font-size: 40px; font-weight: 700; }
    .mid { font-size: 32px; font-weight: 600; }
    .note { font-size: 28px; }
    .orange { fill: #e8730c; } .red { fill: #d62828; } .blue { fill: #2563eb; }
  </style>
  <defs>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#e8730c" stroke-width="1.6" stroke-linecap="round"/></marker>
    <g id="xh">
      <path d="M-12 -4 L-14 0 M10 -4 L12 0 M-11 -22 L-12 -4 M9 -22 L10 -4" stroke="#111" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M-26 -40 C-30 -70 -18 -92 2 -90 C22 -88 30 -66 26 -40 C23 -24 10 -18 -2 -19 C-16 -20 -24 -27 -26 -40 Z" fill="#111" stroke="#111" stroke-width="2"/>
      <circle cx="-8" cy="-62" r="3.6" fill="#fff"/><circle cx="9" cy="-60" r="3.6" fill="#fff"/>
    </g>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>

  <g filter="url(#wobble)" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- the track: two rails with sleepers -->
    <path d="M80 420 C400 418 700 422 1000 420"/>
    <path d="M80 450 C400 448 700 452 1000 450"/>
    <path d="M120 412 L120 458 M200 412 L200 458 M280 412 L280 458 M360 412 L360 458 M440 412 L440 458 M520 412 L520 458 M600 412 L600 458 M680 412 L680 458 M760 412 L760 458 M840 412 L840 458 M920 412 L920 458" stroke-width="1.6"/>
    <!-- the fork after main: up to updates, down to stores -->
    <path d="M1000 420 C1100 400 1200 300 1330 260 M1000 450 C1110 430 1220 330 1340 290"/>
    <path d="M1000 420 C1100 470 1200 560 1330 600 M1000 450 C1090 510 1190 600 1320 630"/>
    <!-- the local gates: a little barrier -->
    <path d="M330 400 L330 330 M330 330 L460 340"/>
    <!-- CI: a signal post with lights -->
    <path d="M640 400 L640 260 M616 260 L664 260 L664 340 L616 340 Z"/>
    <circle cx="640" cy="282" r="9"/><circle cx="640" cy="316" r="9" fill="#111"/>
    <!-- the cart: the branch -->
    <path d="M150 405 L250 406 L246 360 L154 359 Z"/>
    <circle cx="172" cy="412" r="9"/><circle cx="230" cy="412" r="9"/>
    <!-- the switch lever Xiaohei throws -->
    <path d="M980 520 L1010 470 M960 522 L1000 523"/>
    <circle cx="1012" cy="466" r="7" fill="#111"/>
  </g>

  <!-- orange: the way code goes -->
  <g fill="none" stroke="#e8730c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" filter="url(#wobble)">
    <path d="M150 520 C400 540 700 540 960 500"/>
    <path d="M820 380 C860 300 900 240 960 210"/>
  </g>
  <!-- red: main is never pushed to -->
  <g stroke="#d62828" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#wobble)">
    <path d="M820 600 L860 640 M860 600 L820 640"/>
  </g>

  <!-- Xiaohei, both hands on the switch lever -->
  <use href="#xh" transform="translate(940 600) scale(1.3)"/>
  <g stroke="#111" stroke-width="2.6" stroke-linecap="round" fill="none" filter="url(#wobble)">
    <path d="M960 540 L1004 474 M968 556 L1008 486"/>
  </g>

  <!-- labels -->
  <text x="130" y="330" class="mid">a branch</text>
  <text x="300" y="300" class="note">local gates (pre-push)</text>
  <text x="596" y="226" class="mid">CI: 7 checks</text>
  <text x="790" y="400" class="mid">main</text>
  <text x="860" y="140" class="note orange">Vercel deploys the site and the web app</text>
  <text x="1150" y="240" class="mid">JS only: an update</text>
  <text x="1180" y="200" class="note blue">needs the EAS project first</text>
  <text x="1150" y="670" class="mid">native change: a store build</text>
  <text x="1150" y="710" class="note blue">new module, permission, icon</text>
  <text x="660" y="690" class="note red">never push to main · merge on green</text>
  <text x="80" y="820" class="note">ship skill · local-review · store-review before phones</text>
</svg>
