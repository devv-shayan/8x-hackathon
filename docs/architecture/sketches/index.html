<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Chalkback sketches</title>
		<style>
			body {
				margin: 0;
				padding: 16px;
				background: #f4f4f0;
				font-family: system-ui, sans-serif;
				color: #111;
			}
			figure {
				margin: 0 auto 24px;
				max-width: 1600px;
			}
			img {
				display: block;
				width: 100%;
				height: auto;
				background: #fff;
				border: 1px solid #e3e3dd;
			}
			figcaption {
				margin-top: 6px;
				font-size: 14px;
				color: #555;
			}
		</style>
	</head>
	<body>
		<!-- Open this file in a browser to see every sketch at once. README.md says what each explains. -->
		<figure>
			<img src="01-system-map.svg" alt="System map" />
			<figcaption>01 · System map</figcaption>
		</figure>
		<figure>
			<img src="02-one-request.svg" alt="One request through /api/app/v1" />
			<figcaption>02 · One request</figcaption>
		</figure>
		<figure>
			<img src="03-learning-loop.svg" alt="The learning loop" />
			<figcaption>03 · The learning loop</figcaption>
		</figure>
		<figure>
			<img src="04-class-turn.svg" alt="Answering a question in class" />
			<figcaption>04 · A class turn</figcaption>
		</figure>
		<figure>
			<img src="05-voice.svg" alt="Voice" />
			<figcaption>05 · Voice</figcaption>
		</figure>
		<figure>
			<img src="06-shipping.svg" alt="How code ships" />
			<figcaption>06 · Shipping</figcaption>
		</figure>
	</body>
</html>
