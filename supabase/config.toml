# Supabase local development config
# Run `supabase start` to spin up the local stack
# Docs: https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 55322
shadow_port = 55320
# Matches CI (.github/workflows/ci.yml) and new hosted Supabase projects.
major_version = 17

# The schema is Prisma's (apps/web/prisma/schema/migrations): supabase/migrations/ is frozen
# history, already inside the Prisma baseline. So `supabase start` and `supabase db reset`
# must not apply it; `npm run db:reset` resets the stack, then runs the Prisma migrations
# (docs/rules/migrations.md). `supabase db push` has nothing to push, by design: migrations
# reach a deployed database through .github/workflows/deploy-migrations.yml.
[db.migrations]
enabled = false

[db.pooler]
enabled = false
port = 55329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true
ip_version = "IPv4"
max_header_length = 4096

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

# The local email catcher (auth emails land here, never in a real inbox). The CLI's name for
# what was [inbucket], which it now warns is deprecated.
[local_smtp]
enabled = true
port = 55324
smtp_port = 55325
pop3_port = 55326

[storage]
enabled = true
file_size_limit = "50MiB"

# The app's avatars (POST /api/app/v1/uploads). The same bucket the Prisma migration
# 20260924000500_user_uploads_bucket creates on a deployed database: private, no policies,
# and the types and size the route accepts. Change them in both places, and in @app/contract.
[storage.buckets.user-uploads]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp", "image/heic"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
otp_expiry = 86400
otp_length = 6

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"

[auth.external.apple]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""

[auth.external.google]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
port = 55327
backend = "postgres"

[experimental]
orioledb_version = ""
s3_host = "env(S3_HOST)"
s3_region = "env(S3_REGION)"
s3_access_key = "env(S3_ACCESS_KEY)"
s3_secret_key = "env(S3_SECRET_KEY)"

# The app signs in with an emailed code, so the local emails must carry it.
[auth.email.template.magic_link]
subject = "Your sign-in code"
content_path = "./supabase/templates/sign-in-code.html"

[auth.email.template.confirmation]
subject = "Your sign-in code"
content_path = "./supabase/templates/sign-in-code.html"
